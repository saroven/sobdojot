<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>শব্দজট</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;700;800&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e6f2ea; --bg2:#d3e7db; --ink:#0d3a2e; --muted:#3d6b58;
  --slot:#c5ddd0; --slot-line:#5f9c84;
  --tile:#f7b731; --tile-hi:#ffd363; --tile-ink:#2b1a00; --tile-edge:#c98a06;
  --accent:#e0304f; --good:#1f9d55; --bar:#0d3a2e; --bar-track:#c5ddd0;
  --btn:#0d3a2e; --btn-ink:#f4f9f6; --gold:#f7b731;
  --display:"Baloo Da 2","Kalpurush","Noto Sans Bengali","Nirmala UI",sans-serif;
  --body:"Hind Siliguri","Noto Sans Bengali","Kalpurush","Nirmala UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d3a2e; --bg2:#092a21; --ink:#fdf3d7; --muted:#9dc7b4;
    --slot:#092a21; --slot-line:#3f8a72; --bar:#f7b731; --bar-track:#092a21;
    --btn:#fdf3d7; --btn-ink:#0d3a2e;
  }
}
:root[data-theme="dark"]{
  --bg:#0d3a2e; --bg2:#092a21; --ink:#fdf3d7; --muted:#9dc7b4;
  --slot:#092a21; --slot-line:#3f8a72; --bar:#f7b731; --bar-track:#092a21;
  --btn:#fdf3d7; --btn-ink:#0d3a2e;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;height:100%;font-family:var(--body);color:var(--ink);background:var(--bg);
  background-image:radial-gradient(circle at 15% 0%,var(--bg2) 0,transparent 55%),radial-gradient(circle at 90% 100%,var(--bg2) 0,transparent 50%);
  overflow:hidden;user-select:none;-webkit-user-select:none;transition:background-color .4s;
}
body.fever{background-image:radial-gradient(circle at 50% 30%,rgba(247,183,49,.38) 0,transparent 60%),radial-gradient(circle at 90% 100%,rgba(224,48,79,.22) 0,transparent 50%)}
#app{max-width:520px;height:100%;margin:0 auto;padding:14px 16px 18px;display:flex;flex-direction:column;gap:12px;position:relative}
.hud{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.stat{display:flex;flex-direction:column;line-height:1;min-width:64px}
.stat small{font-size:.8rem;color:var(--muted);margin-bottom:2px}
.stat b{font-family:var(--display);font-weight:800;font-size:2rem}
.stat.mid{align-items:center}
.stat.mid b{color:var(--accent)}
.stat.right{text-align:right;align-items:flex-end}
.timer{height:14px;border-radius:9px;background:var(--bar-track);overflow:hidden;position:relative}
#bar{position:absolute;inset:0 auto 0 0;width:100%;background:var(--bar);border-radius:9px;transition:background .3s}
#bar.low{background:var(--accent);animation:pulse .5s infinite alternate}
#bar.fev{background:linear-gradient(90deg,#f7b731,#ffe08a,#f7b731);background-size:200% 100%;animation:slide 1s linear infinite;box-shadow:0 0 12px 2px rgba(247,183,49,.9)}
#bar.daily{background:var(--good)}
@keyframes pulse{to{opacity:.55}}
@keyframes slide{to{background-position:-200% 0}}
.metarow{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.95rem;min-height:30px}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:26px;min-height:0}
#slots,#pool{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.slot{width:clamp(50px,15.5vw,68px);height:clamp(60px,18vw,78px);border-radius:16px;border:2.5px dashed var(--slot-line);background:var(--slot);display:flex;align-items:center;justify-content:center;padding:0}
.slot.full{border:0;background:none}
.tile{
  font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,7.5vw,2.3rem);line-height:1;
  min-width:clamp(50px,15.5vw,68px);height:clamp(60px,18vw,78px);padding:0 10px;
  border:0;border-radius:16px;background:linear-gradient(180deg,var(--tile-hi),var(--tile) 55%);color:var(--tile-ink);cursor:pointer;
  box-shadow:0 6px 0 var(--tile-edge),0 10px 14px rgba(0,0,0,.18);
  transition:transform .08s,box-shadow .08s;touch-action:manipulation;
}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 var(--tile-edge)}
.tile.locked{background:#ffe9a8;box-shadow:0 6px 0 var(--tile-edge),0 0 0 3px var(--good)}
.tile.ghost{visibility:hidden}
.tile.pop{animation:pop .16s ease-out}
.slot .tile{width:100%;min-width:0;padding:0}
@keyframes pop{from{transform:scale(.7)}to{transform:scale(1)}}
#slots.shake{animation:shake .4s}
#slots.win .tile{animation:hop .45s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes hop{40%{transform:translateY(-14px)}}
.actions{display:flex;gap:8px}
.btn{
  flex:1;font-family:var(--body);font-weight:600;font-size:.95rem;padding:11px 4px;border-radius:14px;border:2px solid var(--btn);
  background:transparent;color:var(--ink);cursor:pointer;touch-action:manipulation;line-height:1.25;
}
.btn small{display:block;font-weight:400;font-size:.72rem;color:var(--muted)}
.btn:active{background:var(--btn);color:var(--btn-ink)}
.btn:active small{color:inherit}
.btn:disabled{opacity:.35}
.btn.nudge{animation:nudge 1s infinite;border-color:var(--accent)}
@keyframes nudge{50%{transform:scale(1.06);box-shadow:0 0 0 4px rgba(224,48,79,.25)}}
.btn.primary{background:var(--btn);color:var(--btn-ink);font-size:1.25rem;font-family:var(--display);font-weight:800;padding:13px 26px;flex:none}
.btn.primary small{color:inherit;opacity:.8;font-family:var(--body);font-weight:400}
.btn.primary:active{transform:translateY(2px)}
.btn.wide{width:100%}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#toast{position:absolute;left:0;right:0;top:32%;text-align:center;font-family:var(--display);font-weight:800;font-size:2.2rem;pointer-events:none;opacity:0;z-index:4;padding:0 12px}
#toast.show{animation:toast .95s ease-out}
#toast.long{animation-duration:1.7s}
#toast.bad{color:var(--accent)}
#toast.ok{color:var(--good)}
#toast.gold{color:#d99000;text-shadow:0 0 18px rgba(247,183,49,.7)}
@keyframes toast{0%{opacity:0;transform:translateY(14px) scale(.9)}12%{opacity:1;transform:none}70%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
.overlay{position:absolute;inset:0;background:var(--bg);z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:22px;overflow:auto}
.overlay.hidden{display:none}
.logo{font-family:var(--display);font-weight:800;font-size:clamp(3.2rem,16vw,5rem);line-height:1;margin:0;display:flex;gap:6px;justify-content:center}
.logo span{display:inline-block;background:var(--tile);color:var(--tile-ink);border-radius:14px;padding:6px 12px 10px;box-shadow:0 6px 0 var(--tile-edge)}
.logo span:nth-child(2){transform:rotate(-4deg)}
.logo span:nth-child(3){transform:rotate(3deg)}
.overlay p{margin:0;max-width:34ch;line-height:1.5;color:var(--muted)}
.tag{font-size:1.05rem}
.seg{display:flex;border:2px solid var(--btn);border-radius:14px;overflow:hidden;width:100%;max-width:340px}
.seg button{flex:1;font-family:var(--body);font-weight:600;font-size:1rem;padding:9px 0;border:0;background:transparent;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.menu-col{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px}
.done{color:var(--good);font-weight:600}
.stats{font-size:.88rem}
.big{font-family:var(--display);font-weight:800;font-size:4.2rem;line-height:1;margin:0;color:var(--ink)}
.rank{font-family:var(--display);font-weight:800;font-size:1.5rem;color:var(--ink)!important}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-height:24vh;overflow:auto;max-width:440px}
.chips i{font-style:normal;background:var(--slot);border-radius:20px;padding:3px 12px;font-size:.95rem}
.chips i.h{outline:2px solid var(--gold)} .chips i.s{outline:2px solid var(--accent);opacity:.75}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.icon{background:none;border:0;color:var(--muted);font-family:var(--body);font-size:.9rem;padding:6px 4px;cursor:pointer}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:8}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="app">
  <header class="hud">
    <div class="stat"><small id="l1">স্কোর</small><b id="v1">০</b></div>
    <div class="stat mid"><small id="l2">কম্বো</small><b id="v2">০</b></div>
    <div class="stat right"><small id="l3">সেরা</small><b id="v3">০</b></div>
  </header>
  <div class="timer" role="timer" aria-label="বাকি সময়"><div id="bar"></div></div>
  <div class="metarow"><span id="meta"></span><button class="icon" id="mute">শব্দ চালু</button></div>
  <main class="stage">
    <div id="slots" aria-label="উত্তরের ঘর"></div>
    <div id="pool" aria-label="অক্ষরের টাইল"></div>
  </main>
  <div class="actions">
    <button class="btn" id="shuffle">এলোমেলো</button>
    <button class="btn" id="clear">মুছো</button>
    <button class="btn" id="hint">ইঙ্গিত<small id="hintCost">−৩ সে.</small></button>
    <button class="btn" id="skip">বাদ দাও<small id="skipCost">−৫ সে.</small></button>
  </div>
  <div id="toast" aria-live="polite"></div>

  <section class="overlay" id="menu">
    <h1 class="logo"><span>শব্দ</span><span>জ</span><span>ট</span></h1>
    <p class="tag">অক্ষর সাজাও, শব্দ বানাও, কম্বো বাড়াও।</p>
    <div class="seg" role="group" aria-label="কঠিনতা">
      <button data-d="0">সহজ</button><button data-d="1">মাঝারি</button><button data-d="2">কঠিন</button>
    </div>
    <p id="diffNote" style="min-height:3em"></p>
    <div class="menu-col">
      <button class="btn primary wide" id="goRush">৬০ সেকেন্ড রাশ<small id="rushSub"></small></button>
      <button class="btn wide" id="goDaily" style="padding:12px"><span id="dailyTitle">আজকের চ্যালেঞ্জ</span><small id="dailySub"></small></button>
    </div>
    <p class="stats" id="stats"></p>
  </section>

  <section class="overlay hidden" id="over">
    <p class="rank" id="overRank"></p>
    <p class="big" id="finalScore">০</p>
    <p id="finalNote"></p>
    <div class="chips" id="chips"></div>
    <div class="row">
      <button class="btn primary" id="again">আবার খেলো</button>
      <button class="btn" id="share" style="flex:none;padding:13px 18px">ফলাফল কপি</button>
      <button class="btn" id="toMenu" style="flex:none;padding:13px 18px">মেনু</button>
    </div>
  </section>
</div>

/* ---------- words: cluster split & anagram groups ---------- */
function clusters(s){
  const out=[];
  for(const ch of s){
    const last=out[out.length-1];
    if(last!==undefined&&(/\p{M}|\u200c|\u200d/u.test(ch)||last.endsWith('\u09CD'))) out[out.length-1]=last+ch;
    else out.push(ch);
  }
  return out;
}
const groups=new Map();
[[E,0],[M,1],[H,2]].forEach(([str,t])=>{
  for(const w of str.split('|')){
    if(!w) continue;
    const cl=clusters(w);
    const key=cl.slice().sort().join('\u0001');
    let g=groups.get(key);
    if(!g){g={n:cl.length,words:[],min:t};groups.set(key,g)}
    g.words.push({w,cl,t}); if(t<g.min) g.min=t;
  }
});
// pools[d][n] = groups that contain at least one word of tier <= d
const pools=[0,1,2].map(d=>{const p={3:[],4:[],5:[],6:[]};for(const g of groups.values()) if(g.min<=d) p[g.n].push(g);return p});

/* ---------- rng ---------- */
let rnd=Math.random;
function hashStr(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return h>>>0}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffleArr(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

let ac=null, muted=ls.get('sj-muted',false);
function tone(f,dur=.09,type='triangle',vol=.06,delay=0){
  if(muted) return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur);
  }catch(e){}
}
const sfx={
  tap:()=>tone(520,.05,'sine',.04),
  win:c=>{const b=440*Math.pow(2,Math.min(c,10)/12*1.5);[0,4,7].forEach((s,i)=>tone(b*Math.pow(2,s/12),.14,'triangle',.07,i*.07))},
  bad:()=>tone(150,.22,'sawtooth',.05),
  fever:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.16,'triangle',.07,i*.06)),
  end:()=>[523,440,349,262].forEach((f,i)=>tone(f,.25,'triangle',.07,i*.16))
};
function setMuteLabel(){$('mute').textContent=muted?'শব্দ বন্ধ':'শব্দ চালু'}
$('mute').onclick=()=>{muted=!muted;ls.set('sj-muted',muted);setMuteLabel()};

/* ---------- confetti ---------- */
const cv=$('fx'),cx=cv.getContext&&cv.getContext('2d');
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
let parts=[],raf=0;
function fit(){const r=window.devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;cx.setTransform(r,0,0,r,0,0)}
function burst(n,big){
  if(reduce||!cx) return;
  fit();
  const b=$('slots').getBoundingClientRect(), x=b.left+b.width/2, y=b.top+b.height/2;
  const cols=['#f7b731','#e0304f','#1f9d55','#ffd363','#2fb4c9'];
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=(big?9:5)*(.4+Math.random());
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,r:3+Math.random()*4,c:cols[i%cols.length],l:1});
  }
  if(!raf) raf=requestAnimationFrame(stepFx);
}
function stepFx(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.l>0);
  for(const p of parts){
    p.x+=p.vx;p.y+=p.vy;p.vy+=.28;p.vx*=.99;p.l-=.018;
    cx.globalAlpha=Math.max(0,p.l);cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.r,p.r*1.4);
  }
  cx.globalAlpha=1;
  raf=parts.length?requestAnimationFrame(stepFx):0;
  if(!raf) cx.clearRect(0,0,innerWidth,innerHeight);
}

/* ---------- state ---------- */
let S={running:false,over:true};
let timerId=null;

function levelSize(){
  if(S.mode==='daily') return DAILY_SIZES[S.idx];
  const s=S.solved, cap=DIFF[S.d].cap;
  let n=s<3?3:s<7?4:s<12?5:(rnd()<.5?5:6);
  return Math.min(n,cap);
}
function pickRound(){
  let n=levelSize(), d=S.d, pool=pools[d][n];
  if(!pool.length){pool=pools[2][n]}
  let g,tries=0;
  do{g=pool[Math.floor(rnd()*pool.length)];tries++}while(S.used.has(g)&&tries<40);
  S.used.add(g);
  let cands=g.words.filter(x=>x.t<=d); if(!cands.length) cands=g.words;
  const ans=cands[Math.floor(rnd()*cands.length)];
  const ids=ans.cl.map((_,i)=>i);
  let t=0;
  do{shuffleArr(ids);t++}while(t<25&&g.words.some(x=>x.cl.join('')===ids.map(i=>ans.cl[i]).join('')));
  S.round={g,ans,n,tiles:ids.map(i=>ans.cl[i]),slots:Array(n).fill(null),locked:0,hints:0,t0:performance.now(),last:-1};
}

/* ---------- render ---------- */
function updateHud(){
  if(S.mode==='daily'){
    $('l1').textContent='শব্দ';$('v1').textContent=toBn(Math.min(S.idx+1,8))+'/'+toBn(8);
    $('l2').textContent='সময়';$('v2').textContent=fmt(S.elapsed);
    $('l3').textContent='ইঙ্গিত';$('v3').textContent=toBn(S.hintsTotal);
    $('bar').style.width=(S.idx/8*100)+'%';
  }else{
    $('l1').textContent='স্কোর';$('v1').textContent=toBn(S.score);
    $('l2').textContent='কম্বো';$('v2').textContent=toBn(S.combo);
    $('l3').textContent='সেরা';$('v3').textContent=toBn(Math.max(ls.get('sj-best-'+S.d,0),S.score));
    $('bar').style.width=Math.max(0,S.time/MAXT*100)+'%';
  }
}
function render(){
  const r=S.round;
  updateHud();
  $('meta').textContent=toBn(r.n)+' অক্ষরের শব্দ'+(S.mode==='rush'?' · '+DIFF[S.d].name:' · আজকের চ্যালেঞ্জ');
  const slots=$('slots'); slots.innerHTML='';
  r.slots.forEach((ti,i)=>{
    const d=document.createElement('div'); d.className='slot'+(ti!==null?' full':'');
    if(ti!==null){
      const b=document.createElement('button');
      b.className='tile'+(i<r.locked?' locked':'')+(i===r.last?' pop':'');
      b.textContent=r.tiles[ti];
      if(i>=r.locked) b.onclick=()=>removeSlot(i); else b.disabled=true;
      d.appendChild(b);
    }
    slots.appendChild(d);
  });
  r.last=-1;
  const pool=$('pool'); pool.innerHTML='';
  r.tiles.forEach((t,i)=>{
    const b=document.createElement('button'); b.className='tile'+(r.slots.includes(i)?' ghost':''); b.textContent=t;
    b.onclick=()=>place(i); pool.appendChild(b);
  });
  $('hint').disabled=r.locked>=r.n-1;
  $('hint').classList.remove('nudge');
}
function toast(msg,cls,long){const t=$('toast');t.textContent=msg;t.className='';void t.offsetWidth;t.className='show '+cls+(long?' long':'')}

/* ---------- actions ---------- */
function place(i){
  if(!S.running) return;
  const r=S.round,k=r.slots.indexOf(null);
  if(k<0||r.slots.includes(i)) return;
  r.slots[k]=i;r.last=k;sfx.tap();render();
  if(!r.slots.includes(null)) check();
}
function removeSlot(k){if(!S.running)return;S.round.slots[k]=null;sfx.tap();render()}
function clearSlots(){
  if(!S.running) return;
  const r=S.round;for(let i=r.locked;i<r.n;i++) r.slots[i]=null;sfx.tap();render();
}
function check(){
  const r=S.round, joined=r.slots.map(i=>r.tiles[i]).join('');
  const hit=r.g.words.find(x=>x.w===joined);
  if(hit) onWin(hit); else onWrong();
}
function nextRound(){
  if(S.over) return;
  if(S.mode==='daily'&&S.idx>=8){endDaily();return}
  S.running=true;$('slots').className='';pickRound();render();
}
function onWin(hit){
  const r=S.round, secs=(performance.now()-r.t0)/1000;
  S.found.push({w:hit.w,m:r.hints?'h':'ok'});
  S.running=false;
  $('slots').className='win';
  sfx.win(S.combo+1);
  if(navigator.vibrate) try{navigator.vibrate(20)}catch(e){}
  if(S.mode==='daily'){
    S.idx++; S.marks.push(r.hints?'h':'ok'); updateHud();
    toast(hit.w,'ok'); burst(24,false);
  }else{
    S.combo++;S.maxCombo=Math.max(S.maxCombo,S.combo);S.solved++;
    const mult=1+Math.min(S.combo-1,12)*.25;
    const fever=S.fever>0?2:1;
    const fast=secs<6&&!r.hints;
    const pts=Math.round((r.n*10*mult*(r.hints?Math.pow(.6,r.hints):1)+(fast?10:0))*fever*DIFF[S.d].mult);
    S.score+=pts;
    S.time=Math.min(MAXT,S.time+2+(r.n-3)+(fast?2:0));
    let big=false;
    if(S.combo%5===0){S.fever=FEVER_T;document.body.classList.add('fever');sfx.fever();toast('ঝড়! সময় থেমে গেছে','gold',true);big=true}
    else toast('+'+toBn(pts)+(S.combo>1?'  ×'+toBn(mult):''),'ok');
    burst(big?90:26,big);
    updateHud();
  }
  setTimeout(nextRound,S.mode==='daily'?420:380);
}
function onWrong(){
  S.running=false;sfx.bad();
  $('slots').className='shake';
  if(S.mode==='daily'){S.elapsed+=3;S.wrongs++;toast('হয়নি! +৩ সেকেন্ড','bad')}
  else{S.combo=0;S.time-=2;toast('হয়নি! −২ সেকেন্ড','bad')}
  updateHud();
  setTimeout(()=>{
    if(S.over) return;
    $('slots').className='';S.running=true;
    const r=S.round;for(let i=r.locked;i<r.n;i++) r.slots[i]=null;render();
  },380);
  render();
}
$('shuffle').onclick=()=>{
  if(!S.running) return;const r=S.round;
  const cur=r.slots.map(i=>i===null?null:r.tiles[i]);
  r.slots=Array(r.n).fill(null);
  const shuf=r.tiles.slice();for(let i=shuf.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuf[i],shuf[j]]=[shuf[j],shuf[i]]}
  r.tiles=shuf;
  for(let i=0;i<r.locked;i++){r.slots[i]=r.tiles.findIndex((t,j)=>t===cur[i]&&!r.slots.includes(j))}
  sfx.tap();render();
};
$('clear').onclick=clearSlots;
$('hint').onclick=()=>{
  if(!S.running) return;const r=S.round;if(r.locked>=r.n-1) return;
  r.locked++;r.hints++;S.hintsTotal++;
  if(S.mode==='daily') S.elapsed+=10; else{S.time-=3;S.combo=Math.max(0,S.combo-1)}
  r.slots=Array(r.n).fill(null);
  for(let i=0;i<r.locked;i++){r.slots[i]=r.tiles.findIndex((t,j)=>t===r.ans.cl[i]&&!r.slots.includes(j))}
  sfx.tap();render();
};
$('skip').onclick=()=>{
  if(!S.running) return;
  const r=S.round;
  toast(r.ans.w,'bad',true);sfx.bad();
  S.found.push({w:r.ans.w,m:'s'});
  if(S.mode==='daily'){S.elapsed+=20;S.idx++;S.marks.push('s');updateHud();S.running=false;setTimeout(nextRound,700)}
  else{S.time-=5;S.combo=0;pickRound();render()}
};
document.addEventListener('keydown',e=>{
  if(!S.running) return;
  if(e.key==='Backspace'){const r=S.round;for(let i=r.n-1;i>=r.locked;i--) if(r.slots[i]!==null){removeSlot(i);break}}
  else if(e.key===' '){e.preventDefault();$('shuffle').click()}
});

/* ---------- game flow ---------- */
function begin(mode){
  rnd=mode==='daily'?mulberry(hashStr('sj-'+dayKey())):Math.random;
  S={mode,d:mode==='daily'?1:diff,running:true,over:false,used:new Set(),found:[],last:performance.now(),
     score:0,combo:0,maxCombo:0,solved:0,time:START_T,fever:0,
     idx:0,elapsed:0,hintsTotal:0,wrongs:0,marks:[]};
  document.body.classList.remove('fever');
  $('menu').classList.add('hidden');$('over').classList.add('hidden');
  $('hintCost').textContent=mode==='daily'?'+১০ সে.':'−৩ সে.';
  $('skipCost').textContent=mode==='daily'?'+২০ সে.':'−৫ সে.';
  $('bar').className=mode==='daily'?'daily':'';
  pickRound();render();loop();
}
function loop(){
  clearInterval(timerId);
  timerId=setInterval(()=>{
    if(S.over) return;
    const now=performance.now();
    if(document.hidden){S.last=now;return}
    const dt=Math.min(.5,(now-S.last)/1000);S.last=now;
    const bar=$('bar');
    if(S.mode==='daily'){S.elapsed+=dt;updateHud()}
    else{
      if(S.fever>0){
        S.fever-=dt;bar.className='fev';
        if(S.fever<=0){S.fever=0;document.body.classList.remove('fever')}
      }else{
        S.time-=dt;bar.className=S.time<10?'low':'';
      }
      updateHud();
      if(S.time<=0){endRush();return}
    }
    const r=S.round;
    if(S.running&&r) $('hint').classList.toggle('nudge',now-r.t0>14000&&r.locked===0&&r.n>3);
  },80);
}
function rankOf(score){
  return score<120?'শিক্ষানবিশ':score<300?'শব্দশিকারি':score<600?'শব্দযোদ্ধা':score<1000?'শব্দগুরু':'শব্দসম্রাট';
}
function fillChips(){
  const c=$('chips');c.innerHTML='';
  S.found.forEach(f=>{const i=document.createElement('i');i.textContent=f.w;if(f.m==='h')i.className='h';if(f.m==='s')i.className='s';c.appendChild(i)});
}
function bumpStats(words,maxC){
  const st=ls.get('sj-stats',{games:0,words:0,maxCombo:0});
  st.games++;st.words+=words;st.maxCombo=Math.max(st.maxCombo,maxC);ls.set('sj-stats',st);
}
let shareText='';
function endRush(){
  S.over=true;S.running=false;clearInterval(timerId);sfx.end();
  document.body.classList.remove('fever');
  const key='sj-best-'+S.d,prev=ls.get(key,0),isBest=S.score>prev;
  if(isBest) ls.set(key,S.score);
  bumpStats(S.solved,S.maxCombo);
  $('overRank').textContent=rankOf(S.score);
  $('finalScore').textContent=toBn(S.score);
  $('finalNote').textContent=(isBest&&S.score>0?'নতুন সেরা স্কোর! ':'')+toBn(S.solved)+'টি শব্দ, সেরা কম্বো '+toBn(S.maxCombo)+' ('+DIFF[S.d].name+')';
  fillChips();
  $('again').style.display='';
  shareText='শব্দজট ('+DIFF[S.d].name+'): '+toBn(S.score)+' পয়েন্ট, '+toBn(S.solved)+'টি শব্দ, সেরা কম্বো '+toBn(S.maxCombo)+' — '+rankOf(S.score);
  $('over').classList.remove('hidden');
}
function dailyShare(rec){
  const g=rec.marks.map(m=>m==='ok'?'🟩':m==='h'?'🟨':'🟥').join('');
  return 'শব্দজট — আজকের চ্যালেঞ্জ '+rec.date+'\n'+g+'\nসময় '+fmt(rec.time)+(rec.streak>1?' · '+toBn(rec.streak)+' দিনের ধারা':'');
}
function endDaily(){
  S.over=true;S.running=false;clearInterval(timerId);sfx.end();burst(120,true);
  const today=dayKey(), st=ls.get('sj-streak',{last:'',count:0});
  const count=st.last===today?st.count:(st.last===yesterdayKey()?st.count+1:1);
  ls.set('sj-streak',{last:today,count});
  const rec={date:today,time:S.elapsed,marks:S.marks,words:S.found,streak:count};
  ls.set('sj-daily',rec);
  bumpStats(S.marks.filter(m=>m!=='s').length,0);
  showDailyResult(rec);
}
function showDailyResult(rec){
  $('overRank').textContent='আজকের চ্যালেঞ্জ শেষ';
  $('finalScore').textContent=fmt(rec.time);
  const ok=rec.marks.filter(m=>m==='ok').length;
  $('finalNote').textContent=toBn(ok)+'টি নিজে মিলিয়েছ'+(rec.streak>1?' · '+toBn(rec.streak)+' দিনের ধারা চলছে':'')+'। কাল নতুন ৮টি শব্দ আসবে।';
  const c=$('chips');c.innerHTML='';
  rec.words.forEach(f=>{const i=document.createElement('i');i.textContent=f.w;if(f.m==='h')i.className='h';if(f.m==='s')i.className='s';c.appendChild(i)});
  $('again').style.display='none';
  shareText=dailyShare(rec);
  $('menu').classList.add('hidden');$('over').classList.remove('hidden');
}
$('share').onclick=async()=>{
  try{await navigator.clipboard.writeText(shareText);$('share').textContent='কপি হয়েছে'}catch(e){$('share').textContent='কপি করা গেল না'}
  setTimeout(()=>{$('share').textContent='ফলাফল কপি'},1800);
};

/* ---------- menu ---------- */
function showMenu(){
  S={running:false,over:true};clearInterval(timerId);
  document.body.classList.remove('fever');
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.d===diff)));
  $('diffNote').textContent=DIFF[diff].note;
  const b=ls.get('sj-best-'+diff,0);
  $('rushSub').textContent=b?'সেরা স্কোর '+toBn(b):'কম্বো ৫ হলে ঝড়: সময় থামে, পয়েন্ট দ্বিগুণ';
  const rec=ls.get('sj-daily',null), st=ls.get('sj-streak',{last:'',count:0});
  const done=rec&&rec.date===dayKey();
  const alive=st.last===dayKey()||st.last===yesterdayKey();
  $('dailyTitle').textContent=done?'আজকের ফলাফল দেখো':'আজকের চ্যালেঞ্জ';
  $('dailySub').textContent=done?'সময় '+fmt(rec.time)+' · কালকের জন্য অপেক্ষা করো':'সবার জন্য একই ৮টি শব্দ · কম সময়ে শেষ করো'+(alive&&st.count?' · ধারা '+toBn(st.count)+' দিন':'');
  const s=ls.get('sj-stats',{games:0,words:0,maxCombo:0});
  $('stats').textContent=s.games?('মোট '+toBn(s.games)+'টি খেলা · '+toBn(s.words)+'টি শব্দ · সেরা কম্বো '+toBn(s.maxCombo)):'';
  $('over').classList.add('hidden');$('menu').classList.remove('hidden');
}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{diff=+b.dataset.d;ls.set('sj-diff',diff);showMenu()});
$('goRush').onclick=()=>begin('rush');
$('goDaily').onclick=()=>{
  const rec=ls.get('sj-daily',null);
  if(rec&&rec.date===dayKey()) showDailyResult(rec); else begin('daily');
};
$('again').onclick=()=>begin('rush');
$('toMenu').onclick=showMenu;
window.addEventListener('resize',()=>{if(parts.length&&cx)fit()});
setMuteLabel();
showMenu();
})();
</script>
